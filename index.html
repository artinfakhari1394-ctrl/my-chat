<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Chat</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Tahoma, sans-serif;
    direction: rtl;
    background: #d9dbd5;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   AUTH
========================================================= */

#authPage {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top right, #25d36622, transparent 35%),
        radial-gradient(circle at bottom left, #075e5422, transparent 35%),
        #d9dbd5;
}

.auth-box {
    width: 390px;
    max-width: 100%;
    background: white;
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.16);
    text-align: center;
}

.auth-logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #25d366;
    color: white;
    font-size: 35px;
}

.auth-box h1 {
    color: #075e54;
    margin: 0 0 8px;
}

.auth-subtitle {
    color: #667781;
    font-size: 13px;
    margin-bottom: 25px;
}

.auth-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

.auth-box input:focus {
    border-color: #25d366;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-left: 45px;
}

.password-toggle {
    position: absolute;
    left: 10px;
    top: 7px;
    border: 0;
    background: transparent;
    font-size: 18px;
}

.auth-box .main-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #25d366;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.auth-box .main-button:hover {
    background: #20bd5b;
}

.switch {
    margin-top: 20px;
    color: #075e54;
    cursor: pointer;
    font-size: 14px;
}

.switch:hover {
    text-decoration: underline;
}

#result {
    margin-top: 15px;
    font-size: 13px;
    min-height: 18px;
}


/* =========================================================
   APP
========================================================= */

#chatPage {
    display: none;
    width: 100%;
    max-width: 1350px;
    height: 100vh;
    height: 100dvh;
    margin: auto;
    background: white;
    box-shadow: 0 0 25px rgba(0,0,0,.12);
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 350px;
    min-width: 300px;
    background: #f0f2f5;
    border-left: 1px solid #ddd;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    background: #075e54;
    color: white;
    padding: 15px 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.app-title {
    font-size: 20px;
    font-weight: bold;
}

.header-icons {
    display: flex;
    gap: 5px;
}

.icon-btn {
    border: 0;
    background: transparent;
    color: white;
    font-size: 20px;
    padding: 5px;
    border-radius: 50%;
}

.icon-btn:hover {
    background: rgba(255,255,255,.12);
}


/* =========================================================
   PROFILE
========================================================= */

.profile {
    padding: 12px;
    background: #e9edef;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-bottom: 1px solid #ddd;
}

.profile:hover {
    background: #dde2e5;
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #25d366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-info {
    min-width: 0;
}

.profile-name {
    font-weight: bold;
    font-size: 15px;
}

.profile-status {
    color: #667781;
    font-size: 11px;
    margin-top: 4px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {
    padding: 8px;
    background: #f0f2f5;
}

.search-box input {
    width: 100%;
    border: 0;
    outline: none;
    background: white;
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14px;
}


/* =========================================================
   CONTACTS
========================================================= */

#contacts {
    flex: 1;
    overflow-y: auto;
}

.contact {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: white;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    transition: .15s;
}

.contact:hover {
    background: #f5f5f5;
}

.contact.active {
    background: #d9fdd3;
}

.contact-info {
    min-width: 0;
    flex: 1;
}

.contact-top {
    display: flex;
    justify-content: space-between;
    gap: 5px;
}

.contact-name {
    font-weight: bold;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.contact-time {
    font-size: 10px;
    color: #667781;
    white-space: nowrap;
}

.contact-last {
    color: #667781;
    font-size: 12px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.contact-meta {
    display: flex;
    align-items: center;
    gap: 5px;
}

.unread-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 10px;
    background: #25d366;
    color: white;
    font-size: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 5px;
}

.pin-badge {
    font-size: 11px;
}

.mute-badge {
    font-size: 11px;
}


/* =========================================================
   LOGOUT
========================================================= */

.logout {
    border: 0;
    background: #fff;
    color: #e74c3c;
    padding: 13px;
    border-top: 1px solid #ddd;
    font-size: 14px;
    font-weight: bold;
}

.logout:hover {
    background: #fff5f5;
}


/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
}

.chat-header {
    background: #075e54;
    color: white;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 68px;
}

.back-button {
    display: none;
    border: 0;
    background: transparent;
    color: white;
    font-size: 25px;
    padding: 3px 7px;
}

.chat-header-info {
    flex: 1;
    min-width: 0;
}

.chat-name {
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-status {
    font-size: 11px;
    color: #d7f8ef;
    margin-top: 3px;
}

.chat-actions {
    display: flex;
    gap: 5px;
}

.chat-action {
    background: transparent;
    color: white;
    border: 0;
    font-size: 19px;
    padding: 5px;
    border-radius: 50%;
}

.chat-action:hover {
    background: rgba(255,255,255,.12);
}


/* =========================================================
   CHAT SEARCH
========================================================= */

.chat-search {
    display: none;
    padding: 7px;
    background: #f0f2f5;
}

.chat-search input {
    width: 100%;
    padding: 10px 15px;
    border: 0;
    border-radius: 20px;
    outline: none;
}


/* =========================================================
   MESSAGES
========================================================= */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background:
        radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size: 15px 15px;
    background-color: #efeae2;
}

.message-row {
    display: flex;
    margin-bottom: 8px;
}

.message-row.me {
    justify-content: flex-start;
}

.message-row.other {
    justify-content: flex-end;
}

.message {
    position: relative;
    max-width: 70%;
    padding: 9px 12px;
    border-radius: 9px;
    background: white;
    box-shadow: 0 1px 1px rgba(0,0,0,.08);
}

.message.me {
    background: #d9fdd3;
}

.message.reply {
    border-right: 4px solid #25d366;
}

.reply-preview {
    background: rgba(0,0,0,.06);
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #667781;
    max-width: 100%;
    overflow: hidden;
}

.message-text {
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message-edited {
    color: #667781;
    font-size: 9px;
    margin-right: 5px;
}

.message-bottom {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
}

.message-time {
    color: #667781;
    font-size: 9px;
}

.message-status {
    font-size: 11px;
    color: #53bdeb;
}

.reactions {
    display: flex;
    gap: 2px;
    margin-top: 4px;
    flex-wrap: wrap;
}

.reaction {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 2px 5px;
    font-size: 11px;
}


/* =========================================================
   MESSAGE MENU
========================================================= */

.message-menu {
    position: absolute;
    top: 30px;
    left: 5px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
    z-index: 20;
    overflow: hidden;
    min-width: 145px;
}

.message-menu button {
    display: block;
    width: 100%;
    border: 0;
    background: white;
    padding: 9px 12px;
    text-align: right;
    font-size: 12px;
}

.message-menu button:hover {
    background: #f0f2f5;
}


/* =========================================================
   INPUT
========================================================= */

.input-area {
    padding: 9px;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    gap: 7px;
    position: relative;
}

.input-icon {
    border: 0;
    background: transparent;
    font-size: 21px;
    width: 32px;
    height: 40px;
    flex-shrink: 0;
}

.input-icon:hover {
    opacity: .7;
}

#messageInput {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: white;
    border-radius: 22px;
    padding: 12px 15px;
    font-size: 14px;
}

#messageInput::placeholder {
    color: #8696a0;
}

.send-button {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 0;
    background: #25d366;
    color: white;
    font-size: 19px;
    flex-shrink: 0;
}

.send-button:hover {
    background: #20bd5b;
}


/* =========================================================
   EMOJI
========================================================= */

.emoji-panel {
    display: none;
    position: absolute;
    bottom: 65px;
    right: 10px;
    width: 290px;
    max-height: 260px;
    overflow-y: auto;
    background: white;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 100;
}

.emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
}

.emoji {
    border: 0;
    background: transparent;
    font-size: 22px;
    padding: 5px;
    border-radius: 7px;
}

.emoji:hover {
    background: #f0f2f5;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #667781;
}

.empty-chat-content {
    background: rgba(255,255,255,.75);
    padding: 28px;
    border-radius: 15px;
}

.empty-chat-content h2 {
    color: #075e54;
    margin-top: 0;
}


/* =========================================================
   REPLY / EDIT BAR
========================================================= */

.reply-bar {
    display: none;
    padding: 8px 12px;
    background: #fff;
    border-right: 4px solid #25d366;
    align-items: center;
    gap: 10px;
}

.reply-bar-content {
    flex: 1;
    min-width: 0;
}

.reply-bar-title {
    color: #075e54;
    font-size: 12px;
    font-weight: bold;
}

.reply-bar-text {
    color: #667781;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cancel-reply {
    border: 0;
    background: transparent;
    font-size: 18px;
}


/* =========================================================
   MODALS
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    width: 400px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 15px;
    padding: 22px;
}

.modal-title {
    margin: 0 0 18px;
    color: #075e54;
}

.modal input {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
}

.modal-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 11px;
    margin-top: 7px;
}

.primary {
    background: #25d366;
    color: white;
}

.secondary {
    background: #ddd;
}

.danger {
    background: #e74c3c;
    color: white;
}

.modal-info {
    background: #f0f2f5;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 10px;
    line-height: 1.9;
    font-size: 13px;
}


/* =========================================================
   LARGE AVATAR
========================================================= */

.large-avatar {
    width: 95px;
    height: 95px;
    margin: 10px auto 20px;
    border-radius: 50%;
    background: #25d366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    overflow: hidden;
}

.large-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: white;
    padding: 11px 18px;
    border-radius: 22px;
    font-size: 13px;
    z-index: 5000;
    display: none;
    box-shadow: 0 4px 15px rgba(0,0,0,.25);
    max-width: 90%;
    text-align: center;
}


/* =========================================================
   DARK MODE
========================================================= */

body.dark {
    background: #111b21;
}

body.dark #authPage {
    background: #111b21;
}

body.dark .auth-box {
    background: #202c33;
    color: white;
}

body.dark .auth-box h1 {
    color: #25d366;
}

body.dark .auth-subtitle {
    color: #8696a0;
}

body.dark .auth-box input {
    background: #2a3942;
    color: white;
    border-color: #374045;
}

body.dark .switch {
    color: #25d366;
}

body.dark .sidebar {
    background: #202c33;
    border-color: #374045;
}

body.dark .profile,
body.dark .search-box {
    background: #202c33;
}

body.dark .profile:hover {
    background: #26343b;
}

body.dark .contact {
    background: #111b21;
    color: white;
    border-color: #26343b;
}

body.dark .contact:hover {
    background: #202c33;
}

body.dark .contact.active {
    background: #164c40;
}

body.dark .contact-last,
body.dark .contact-time,
body.dark .profile-status {
    color: #8696a0;
}

body.dark .search-box input {
    background: #2a3942;
    color: white;
}

body.dark .logout {
    background: #202c33;
    border-color: #374045;
}

body.dark .messages {
    background-color: #0b141a;
}

body.dark .input-area {
    background: #202c33;
}

body.dark #messageInput {
    background: #2a3942;
    color: white;
}

body.dark .message {
    background: #202c33;
    color: white;
}

body.dark .message.me {
    background: #005c4b;
}

body.dark .message-time,
body.dark .message-edited {
    color: #8696a0;
}

body.dark .emoji-panel,
body.dark .message-menu {
    background: #202c33;
    color: white;
}

body.dark .emoji:hover,
body.dark .message-menu button:hover {
    background: #2a3942;
}

body.dark .message-menu button {
    background: #202c33;
    color: white;
}

body.dark .reply-bar {
    background: #202c33;
}

body.dark .reply-bar-text {
    color: #8696a0;
}

body.dark .modal-box {
    background: #202c33;
    color: white;
}

body.dark .modal-title {
    color: #25d366;
}

body.dark .modal input {
    background: #2a3942;
    color: white;
    border-color: #374045;
}

body.dark .modal-info {
    background: #2a3942;
}

body.dark .empty-chat-content {
    background: rgba(32,44,51,.85);
}

body.dark .empty-chat-content h2 {
    color: #25d366;
}

body.dark .chat-search {
    background: #202c33;
}

body.dark .chat-search input {
    background: #2a3942;
    color: white;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #chatPage {
        max-width: none;
    }

    .sidebar {
        width: 100%;
        min-width: 0;
    }

    .chat {
        display: none;
    }

    .app.chat-open .sidebar {
        display: none;
    }

    .app.chat-open .chat {
        display: flex;
        width: 100%;
    }

    .back-button {
        display: block;
    }

    .sidebar-header {
        padding: 14px 10px;
    }

    .app-title {
        font-size: 18px;
    }

    .profile {
        padding: 10px;
    }

    .contact {
        padding: 12px;
    }

    .contact-name {
        font-size: 14px;
    }

    .contact-last {
        font-size: 11px;
    }

    .messages {
        padding: 12px 7px;
    }

    .message {
        max-width: 88%;
    }

    .message-text {
        font-size: 13px;
    }

    .emoji-panel {
        width: 250px;
        right: 5px;
    }

    .auth-box {
        padding: 25px 20px;
    }

    .chat-header {
        padding: 8px 8px;
    }

    .chat-name {
        font-size: 15px;
    }

    .input-area {
        padding: 7px 5px;
        gap: 3px;
    }

    .input-icon {
        width: 30px;
        font-size: 19px;
    }

    #messageInput {
        padding: 11px 12px;
        font-size: 13px;
    }

    .send-button {
        width: 42px;
        height: 42px;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     AUTH
===================================================== -->

<div id="authPage">

    <div class="auth-box">

        <div class="auth-logo">
            💬
        </div>

        <h1 id="authTitle">
            ورود به My Chat
        </h1>

        <div class="auth-subtitle">
            پیام‌رسان آزمایشی Stage 1
        </div>

        <input
            type="text"
            id="name"
            placeholder="نام نمایشی"
            style="display:none;"
        >

        <input
            type="text"
            id="username"
            placeholder="نام کاربری"
            autocomplete="username"
        >

        <div class="password-wrap">

            <input
                type="password"
                id="password"
                placeholder="رمز عبور"
                autocomplete="current-password"
            >

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('password')"
            >
                👁️
            </button>

        </div>

        <div
            class="password-wrap"
            id="confirmPasswordWrap"
            style="display:none;"
        >

            <input
                type="password"
                id="confirmPassword"
                placeholder="تکرار رمز عبور"
            >

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword')"
            >
                👁️
            </button>

        </div>

        <button
            class="main-button"
            id="mainButton"
            onclick="mainAction()"
        >
            ورود
        </button>

        <div
            class="switch"
            id="switchButton"
            onclick="showRegister()"
        >
            حساب نداری؟ ثبت‌نام کن
        </div>

        <div id="result"></div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="chatPage">

    <div class="app" id="app">


        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <div class="app-title">
                    💬 My Chat
                </div>

                <div class="header-icons">

                    <button
                        class="icon-btn"
                        onclick="openSettings()"
                        title="تنظیمات"
                    >
                        ⚙️
                    </button>

<script>

/* =========================================================
   STORAGE
========================================================= */

const USERS_KEY = "myChatUsers";
const MESSAGES_KEY = "myChatMessages";
const SETTINGS_KEY = "myChatSettings";
const SESSION_KEY = "myChatCurrentUser";


let users = loadJSON(USERS_KEY, []);
let messages = loadJSON(MESSAGES_KEY, []);
let settings = loadJSON(SETTINGS_KEY, {});

let currentUser = null;
let currentChatUser = null;

let editingMessageId = null;
let replyingTo = null;

let typingTimer = null;
let toastTimer = null;


/* =========================================================
   SAFE JSON LOADER
========================================================= */

function loadJSON(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        const parsed =
            JSON.parse(value);

        return parsed ?? fallback;

    } catch (error) {

        console.warn(
            "Storage read error:",
            key,
            error
        );

        return fallback;
    }
}


/* =========================================================
   EMOJIS
========================================================= */

const emojis = [
    "😀","😃","😄","😁","😆","😅","😂","🤣",
    "😊","😇","🙂","🙃","😉","😌","😍","🥰",
    "😘","😗","😙","😚","😋","😛","😝","😜",
    "🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
    "😒","😞","😔","😟","😕","🙁","☹️","😣",
    "😖","😫","😩","🥺","😢","😭","😤","😠",
    "😡","🤬","🤯","😳","🥵","🥶","😱","😨",
    "😰","😥","😓","🤗","🤔","🤭","🤫","🤥",
    "😶","😐","😑","😬","🙄","😯","😦","😧",
    "😮","😲","🥱","😴","🤤","😪","😵","🤐",
    "🤢","🤮","🤧","😷","🤒","🤕","👍","👎",
    "👏","🙌","🙏","🤝","💪","👌","✌️","🤞",
    "❤️","🧡","💛","💚","💙","💜","🖤","🤍",
    "💔","🔥","✨","⭐","🌟","💯","🎉","🎊",
    "🚀","🎁","💡","☀️","🌈","⚡","🍕","🍔"
];

const reactions = [
    "❤️",
    "👍",
    "😂",
    "😮",
    "😢",
    "👏"
];


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        buildEmojiPanel();

        applySettings();

        restoreSession();

        setupEnterKeys();

    }
);


/* =========================================================
   RESTORE SESSION
========================================================= */

function restoreSession() {

    const session =
        localStorage.getItem(
            SESSION_KEY
        );

    if (!session) {

        showLogin();

        return;
    }


    const username =
        normalizeUsername(session);


    const user =
        users.find(
            function(item) {

                return (
                    normalizeUsername(
                        item.username
                    ) === username
                );

            }
        );


    if (!user) {

        localStorage.removeItem(
            SESSION_KEY
        );

        showLogin();

        return;
    }


    currentUser =
        user;

    currentUser.online =
        true;

    updateUserInArray();

    saveUsers();

    showChatPage();

}


/* =========================================================
   AUTH
========================================================= */

function showRegister() {

    document.getElementById(
        "authTitle"
    ).textContent =
        "ثبت نام در My Chat";


    document.getElementById(
        "name"
    ).style.display =
        "block";


    document.getElementById(
        "confirmPasswordWrap"
    ).style.display =
        "block";


    document.getElementById(
        "mainButton"
    ).textContent =
        "ثبت نام";


    document.getElementById(
        "switchButton"
    ).textContent =
        "قبلاً حساب داری؟ ورود";


    document.getElementById(
        "switchButton"
    ).onclick =
        showLogin;


    document.getElementById(
        "result"
    ).textContent =
        "";

}


function showLogin() {

    document.getElementById(
        "authTitle"
    ).textContent =
        "ورود به My Chat";


    document.getElementById(
        "name"
    ).style.display =
        "none";


    document.getElementById(
        "confirmPasswordWrap"
    ).style.display =
        "none";


    document.getElementById(
        "mainButton"
    ).textContent =
        "ورود";


    document.getElementById(
        "switchButton"
    ).textContent =
        "حساب نداری؟ ثبت‌نام کن";


    document.getElementById(
        "switchButton"
    ).onclick =
        showRegister;


    document.getElementById(
        "result"
    ).textContent =
        "";

}


function mainAction() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const username =
        normalizeUsername(
            document.getElementById(
                "username"
            ).value
        );


    const password =
        document.getElementById(
            "password"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    const isRegister =
        document.getElementById(
            "mainButton"
        ).textContent ===
        "ثبت نام";


    if (isRegister) {

        if (
            !name ||
            !username ||
            !password ||
            !confirmPassword
        ) {

            showResult(
                "لطفاً همه قسمت‌ها را پر کن.",
                "red"
            );

            return;
        }


        if (username.length < 3) {

            showResult(
                "نام کاربری باید حداقل ۳ کاراکتر باشد.",
                "red"
            );

            return;
        }


        if (
            !/^[a-z0-9_]+$/i.test(
                username
            )
        ) {

            showResult(
                "نام کاربری فقط می‌تواند شامل حروف انگلیسی، عدد و _ باشد.",
                "red"
            );

            return;
        }


        if (password.length < 4) {

            showResult(
                "رمز عبور باید حداقل ۴ کاراکتر باشد.",
                "red"
            );

            return;
        }


        if (password !== confirmPassword) {

            showResult(
                "رمز عبور و تکرار آن یکسان نیست.",
                "red"
            );

            return;
        }


        const exists =
            users.some(
                function(user) {

                    return (
                        normalizeUsername(
                            user.username
                        ) === username
                    );

                }
            );


        if (exists) {

            showResult(
                "این نام کاربری قبلاً ثبت شده است.",
                "red"
            );

            return;
        }


        const newUser = {

            name:
                name,

            username:
                username,

            password:
                password,

            avatar:
                "",

            online:
                false,

            createdAt:
                Date.now()

        };


        users.push(
            newUser
        );

        saveUsers();


        showResult(
            "ثبت نام با موفقیت انجام شد.",
            "green"
        );


        document.getElementById(
            "username"
        ).value =
            username;


        document.getElementById(
            "password"
        ).value =
            "";


        document.getElementById(
            "confirmPassword"
        ).value =
            "";


        setTimeout(
            showLogin,
            700
        );

        return;
    }


    if (!username || !password) {

        showResult(
            "نام کاربری و رمز عبور را وارد کن.",
            "red"
        );

        return;
    }


    const user =
        users.find(
            function(item) {

                return (
                    normalizeUsername(
                        item.username
                    ) === username &&
                    item.password === password
                );

            }
        );


    if (!user) {

        showResult(
            "نام کاربری یا رمز عبور اشتباه است.",
            "red"
        );

        return;
    }


    currentUser =
        user;

    currentUser.online =
        true;

    updateUserInArray();

    saveUsers();


    localStorage.setItem(
        SESSION_KEY,
        currentUser.username
    );


    showChatPage();

}


/* =========================================================
   AUTH ENTER KEY
========================================================= */

function setupEnterKeys() {

    [
        "username",
        "password",
        "confirmPassword",
        "name"
    ].forEach(
        function(id) {

            const input =
                document.getElementById(id);

            if (!input) {
                return;
            }

            input.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        mainAction();

                    }

                }
            );

        }
    );

}


function showResult(
    message,
    color
) {

    const result =
        document.getElementById(
            "result"
        );

    result.textContent =
        message;

    result.style.color =
        color;

}


/* =========================================================
   SHOW APP
========================================================= */

function showChatPage() {

    document.getElementById(
        "authPage"
    ).style.display =
        "none";


    document.getElementById(
        "chatPage"
    ).style.display =
        "block";


    updateMyProfile();

    loadContacts();

}


/* =========================================================
   SAVE
========================================================= */

function saveUsers() {

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


function saveMessages() {

    localStorage.setItem(
        MESSAGES_KEY,
        JSON.stringify(messages)
    );

}


function saveSettings() {

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );

}


function updateUserInArray() {

    if (!currentUser) {
        return;
    }


    const index =
        users.findIndex(
            function(user) {

                return (
                    normalizeUsername(
                        user.username
                    ) ===
                    normalizeUsername(
                        currentUser.username
                    )
                );

            }
        );


    if (index !== -1) {

        users[index] =
            currentUser;

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username || ""
    )
    .trim()
    .toLowerCase();

}


/* =========================================================
   PASSWORD
========================================================= */

function togglePassword(id) {

    const input =
        document.getElementById(id);


    input.type =
        input.type === "password"
            ? "text"
            : "password";

}


/* =========================================================
   PROFILE
========================================================= */

function updateMyProfile() {

    if (!currentUser) {
        return;
    }


    document.getElementById(
        "myProfileName"
    ).textContent =
        currentUser.name;


    document.getElementById(
        "myProfileStatus"
    ).textContent =
        "🟢 آنلاین";


    setAvatar(
        "myAvatar",
        currentUser
    );

}


function setAvatar(
    elementId,
    user
) {

    const element =
        document.getElementById(
            elementId
        );


    if (!element) {
        return;
    }


    setAvatarElement(
        element,
        user
    );

}


function setAvatarElement(
    element,
    user
) {

    element.innerHTML =
        "";


    if (
        user &&
        user.avatar
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            user.avatar;

        img.alt =
            user.name || "avatar";

        element.appendChild(
            img
        );

    } else {

        const first =
            user &&
            user.name
                ? user.name.charAt(0)
                : "👤";

        element.textContent =
            first;

    }

}


function openProfile() {

    if (!currentUser) {
        return;
    }


    document.getElementById(
        "profileModal"
    ).style.display =
        "flex";


    document.getElementById(
        "profileNameInput"
    ).value =
        currentUser.name;


    document.getElementById(
        "profileImageInput"
    ).value =
        "";


    setAvatar(
        "largeAvatar",
        currentUser
    );

}


function saveProfile() {

    if (!currentUser) {
        return;
    }


    const name =
        document.getElementById(
            "profileNameInput"
        ).value.trim();


    if (!name) {

        showToast(
            "نام را وارد کن."
        );

        return;
    }


    currentUser.name =
        name;


    const file =
        document.getElementById(
            "profileImageInput"
        ).files[0];


    if (file) {

        if (
            file.size >
            1024 * 1024
        ) {

            showToast(
                "حجم تصویر باید کمتر از ۱ مگابایت باشد."
            );

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                currentUser.avatar =
                    event.target.result;

                finishProfileSave();

            };


        reader.readAsDataURL(
            file
        );

    } else {

        finishProfileSave();

    }

}


function finishProfileSave() {

    updateUserInArray();

    saveUsers();

    updateMyProfile();

    loadContacts();


    if (currentChatUser) {

        const fresh =
            users.find(
                function(user) {

                    return (
                        normalizeUsername(
                            user.username
                        ) ===
                        normalizeUsername(
                            currentChatUser.username
                        )
                    );

                }
            );


        if (fresh) {

            currentChatUser =
                fresh;


            document.getElementById(
                "chatName"
            ).textContent =
                fresh.name;


            setAvatar(
                "chatAvatar",
                fresh
            );


            updateChatStatus();

        }

    }


    closeModal(
        "profileModal"
    );


    showToast(
        "پروفایل با موفقیت ذخیره شد."
    );

}


/* =========================================================
   CONTACTS
========================================================= */

function loadContacts(
    searchText = ""
) {

    const container =
        document.getElementById(
            "contacts"
        );


    if (!container) {
        return;
    }


    container.innerHTML =
        "";


    if (!currentUser) {
        return;
    }


    const query =
        String(
            searchText || ""
        )
        .trim()
        .toLowerCase();


    let list =
        users.filter(
            function(user) {

                if (
                    normalizeUsername(
                        user.username
                    ) ===
                    normalizeUsername(
                        currentUser.username
                    )
                ) {

                    return false;

                }


                if (!query) {
                    return true;
                }


                return (
                    String(
                        user.name || ""
                    )
                    .toLowerCase()
                    .includes(query) ||

                    normalizeUsername(
                        user.username
                    )
                    .includes(query)
                );

            }
        );


    list.sort(
        function(a, b) {

            const pinA =
                isPinned(
                    a.username
                )
                    ? 1
                    : 0;


            const pinB =
                isPinned(
                    b.username
                )
                    ? 1
                    : 0;


            if (
                pinA !== pinB
            ) {

                return pinB - pinA;

            }


            const msgA =
                getLastMessage(
                    a.username
                );


            const msgB =
                getLastMessage(
                    b.username
                );


            const timeA =
                msgA
                    ? Number(
                        msgA.timestamp || 0
                    )
                    : 0;


            const timeB =
                msgB
                    ? Number(
                        msgB.timestamp || 0
                    )
                    : 0;


            if (
                timeA !== timeB
            ) {

                return timeB - timeA;

            }


            return String(
                a.name || ""
            ).localeCompare(
                String(
                    b.name || ""
                ),
                "fa"
            );

        }
    );


    if (list.length === 0) {

        container.innerHTML =
            `
            <div style="
                padding:30px 15px;
                text-align:center;
                color:#667781;
            ">

                <div style="font-size:30px;">
                    🔎
                </div>

                <div style="margin-top:10px;">
                    مخاطبی پیدا نشد.
                </div>

                <div style="
                    margin-top:7px;
                    font-size:11px;
                    line-height:1.8;
                ">
                    برای گفتگو باید یک کاربر دیگر
                    در همین مرورگر ثبت‌نام کرده باشد.
                </div>

            </div>
            `;

        return;
    }


    list.forEach(
        function(user) {

            const contact =
                document.createElement(
                    "div"
                );


            contact.className =
                "contact";

                ) ===

                )
            ) {

                );

                );

                "avatar";

                avatar,
                user
            );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "contact-info";


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "contact-top";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "contact-name";


            name.textContent =
                user.name;


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "contact-meta";


            if (
                isPinned(
                    user.username
                )
            ) {

                const pin =
                    document.createElement(
                        "span"
                    );

                pin.className =
                    "pin-badge";

                pin.textContent =
                    "📌";

                meta.appendChild(
                    pin
                );

            }


            if (
                isMuted(
                    user.username
                )
            ) {

                const mute =
                    document.createElement(
                        "span"
                    );

                mute.className =
                    "mute-badge";

                mute.textContent =
                    "🔕";

                meta.appendChild(
                    mute
                );

            }


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "contact-time";


            time.textContent =
                getLastMessageTime(
                    user.username
                );


            meta.appendChild(
                time
            );


            top.appendChild(
                name
            );

            top.appendChild(
                meta
            );


            const last =
                document.createElement(
                    "div"
                );


            last.className =
                "contact-last";


            last.textContent =
                getLastMessageText(
                    user.username
                );


            const unread =
                getUnreadCount(
                    user.username
                );


            if (
                unread > 0
            ) {

                const badge =
                    document.createElement(
                        "span"
                    );


                badge.className =
                    "unread-badge";

            }


            info.appendChild(

            );


            info.appendChild(

            );

                avatar
            );


            contact.appendChild(
                info
            );

                    openChat(
                        user

                };

                contact

        }

}


function searchContacts() {

    const value =
        document.getElementById(
            "contactSearch"
        ).value;


    loadContacts(
        value
    );

}


/* =========================================================
   CHAT ID
========================================================= */

function getChatId(
    user1,
    user2
) {

    return [
        normalizeUsername(user1),
        normalizeUsername(user2)
    ]
    .sort()
    .join("__");

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(
    user
) {

    if (!user) {
        return;
    }


    currentChatUser =
        user;


    document.getElementById(
        "chatName"
    ).textContent =
        user.name;


    setAvatar(
        "chatAvatar",
        user
    );


    updateChatStatus();


    markMessagesAsRead();


    document.getElementById(
        "messageSearch"
    ).value =
        "";


    document.getElementById(
        "chatSearchBar"
    ).style.display =
        "none";


    cancelReply();


    editingMessageId =
        null;


    updateReplyBar();


    renderMessages();


    loadContacts(
        document.getElementById(
            "contactSearch"
        ).value
    );


    document.getElementById(
        "app"
    ).classList.add(
        "chat-open"
    );


    setTimeout(
        function() {

            document.getElementById(
                "messageInput"
            ).focus();

        },
        50
    );

}


function backToContacts() {

    document.getElementById(
        "app"
    ).classList.remove(
        "chat-open"
    );


    closeEmoji();


    currentChatUser =
        null;


    cancelReply();


    editingMessageId =
        null;

}


function updateChatStatus() {

    if (!currentChatUser) {
        return;
    }


    const fresh =
        users.find(
            function(user) {

                return (
                    normalizeUsername(
                        user.username
                    ) ===
                    normalizeUsername(
                        currentChatUser.username
                    )
                );

            }
        );


    if (fresh) {

        currentChatUser =
            fresh;

    }


    document.getElementById(
        "chatStatus"
    ).textContent =
        currentChatUser.online
            ? "🟢 آنلاین"
            : "⚪ آفلاین";

}


/* =========================================================
   READ
========================================================= */

function markMessagesAsRead() {

    if (
        !currentUser ||
        !currentChatUser
    ) {

        return;
    }


    const chatId =
        getChatId(
            currentUser.username,
            currentChatUser.username
        );


    let changed =
        false;


    messages.forEach(
        function(message) {

            if (
                message.chatId === chatId &&
                message.receiver === currentUser.username &&
                !message.read
            ) {

                message.read =
                    true;

                changed =
                    true;

            }

        }
    );


    if (changed) {

        saveMessages();

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    filterText = ""
) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    if (!currentChatUser) {

        showEmptyChat();

        return;
    }


    const chatId =
        getChatId(
            currentUser.username,
            currentChatUser.username
        );


    let chatMessages =
        messages
            .filter(
                function(message) {

                    return (
                        message.chatId ===
                        chatId
                    );

                }
            )
            .sort(
                function(a, b) {

                    return (
                        Number(
                            a.timestamp || 0
                        ) -
                        Number(
                            b.timestamp || 0
                        )
                    );

                }
            );


    const query =
        String(
            filterText || ""
        )
        .trim()
        .toLowerCase();


    if (query) {

        chatMessages =
            chatMessages.filter(
                function(message) {

                    return String(
                        message.text || ""
                    )
                    .toLowerCase()
                    .includes(query);

                }
            );

    }


    if (chatMessages.length === 0) {

        container.innerHTML =
            `
            <div class="empty-chat">

                <div class="empty-chat-content">

                    <h2>💬</h2>

                    <p>
                        ${
                            query
                                ? "پیامی پیدا نشد."
                                : "هنوز پیامی وجود ندارد."
                        }
                    </p>

                </div>

            </div>
            `;

        return;
    }


    let lastDate =
        "";


    chatMessages.forEach(
        function(message) {

            const dateText =
                formatDate(
                    message.timestamp
                );


            if (
                dateText !== lastDate
            ) {

                const dateSeparator =
                    document.createElement(
                        "div"
                    );


                dateSeparator.style.textAlign =
                    "center";


                dateSeparator.style.margin =
                    "10px 0";


                dateSeparator.innerHTML =
                    `
                    <span style="
                        background:rgba(255,255,255,.75);
                        padding:5px 12px;
                        border-radius:12px;
                        color:#667781;
                        font-size:10px;
                    ">
                        ${escapeHtml(dateText)}
                    </span>
                    `;


                container.appendChild(
                    dateSeparator
                );


                lastDate =
                    dateText;

            }


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row";


            const mine =
                normalizeUsername(
                    message.sender
                ) ===
                normalizeUsername(
                    currentUser.username
                );


            row.classList.add(
                mine
                    ? "me"
                    : "other"
            );


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "message";


            if (mine) {

                box.classList.add(
                    "me"
                );

            }


            if (
                message.replyTo
            ) {

                box.classList.add(
                    "reply"
                );


                const reply =
                    document.createElement(
                        "div"
                    );


                reply.className =
                    "reply-preview";


                reply.textContent =
                    "↩ " +
                    (
                        message.replyTo.text ||
                        ""
                    );


                box.appendChild(
                    reply
                );

            }


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "message-text";


            text.textContent =
                message.text || "";


            box.appendChild(
                text
            );


            const bottom =
                document.createElement(
                    "div"
                );


            bottom.className =
                "message-bottom";


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "message-time";


            time.textContent =
                message.time ||
                formatTime(
                    message.timestamp
                );


            bottom.appendChild(
                time
            );


            if (
                message.edited
            ) {

                const edited =
                    document.createElement(
                        "span"
                    );


                edited.className =
                    "message-edited";


                edited.textContent =
                    "ویرایش‌شده";


                bottom.appendChild(
                    edited
                );

            }


            if (mine) {

                const status =
                    document.createElement(
                        "span"
                    );


                status.className =
                    "message-status";


                status.textContent =
                    message.read
                        ? "✓✓"
                        : "✓";


                bottom.appendChild(
                    status
                );

            }


            box.appendChild(
                bottom
            );


            if (
                message.reactions &&
                message.reactions.length
            ) {

                const reactionBox =
                    document.createElement(
                        "div"
                    );


                reactionBox.className =
                    "reactions";


                message.reactions.forEach(
                    function(reaction) {

                        const r =
                            document.createElement(
                                "span"
                            );


                        r.className =
                            "reaction";


                        r.textContent =
                            reaction;


                        reactionBox.appendChild(
                            r
                        );

                    }
                );


                box.appendChild(
                    reactionBox
                );

            }


            box.addEventListener(
                "contextmenu",
                function(event) {

                    event.preventDefault();

                    showMessageMenu(
                        event,
                        message
                    );

                }
            );


            box.addEventListener(
                "dblclick",
                function(event) {

                    showMessageMenu(
                        event,
                        message
                    );

                }
            );


            row.appendChild(
                box
            );


            container.appendChild(
                row
            );

        }
    );


    if (!query) {

        requestAnimationFrame(
            function() {

                container.scrollTop =
                    container.scrollHeight;

            }
        );

    }

}

        );

                </h2>

                </p>

        `;

}


/* =========================================================
   SEND
========================================================= */

function sendMessage() {

    if (!currentUser) {
        return;
    }


    if (!currentChatUser) {

        showToast(
            "اول یک مخاطب را انتخاب کن."
        );

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /* EDIT */

    if (
        editingMessageId
    ) {

        const target =
            messages.find(
                function(message) {

                    return (
                        message.id ===
                        editingMessageId
                    );

                }
            );


        if (
            target &&
            target.sender ===
            currentUser.username
        ) {

            target.text =
                text;

            target.edited =
                true;

            target.editedAt =
                Date.now();

            target.timestamp =
                Date.now();

            target.time =
                formatTime(
                    target.timestamp
                );

        }


        editingMessageId =
            null;


        input.value =
            "";


        cancelReply();


        saveMessages();

        renderMessages();

        loadContacts();


        showToast(
            "پیام ویرایش شد."
        );


        return;
    }


    const timestamp =
        Date.now();


    const newMessage = {

        id:
            timestamp.toString() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        chatId:
            getChatId(
                currentUser.username,
                currentChatUser.username
            ),

        sender:
            currentUser.username,

        receiver:
            currentChatUser.username,

        text:
            text,

        time:
            formatTime(
                timestamp
            ),

        timestamp:
            timestamp,

        read:
            false,

        edited:
            false,

        reactions:
            [],

        replyTo:
            replyingTo
                ? {
                    id:
                        replyingTo.id,

                    text:
                        replyingTo.text
                }
                : null

    };


    messages.push(
        newMessage
    );


    input.value =
        "";


    cancelReply();


    saveMessages();


    renderMessages();


    loadContacts();


    closeEmoji();


    showToast(
        "پیام ارسال شد."
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKey(
    event
) {

    /*
       Enter = ارسال
       Shift + Enter = خط جدید
    */

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   MESSAGE MENU
========================================================= */

function showMessageMenu(
    event,
    message
) {

    document
        .querySelectorAll(
            ".message-menu"
        )
        .forEach(
            function(menu) {

                menu.remove();

            }
        );


    const menu =
        document.createElement(
            "div"
        );


    menu.className =
        "message-menu";


    const reply =
        createMenuButton(
            "↩ پاسخ",
            function() {

                editingMessageId =
                    null;


                replyingTo = {

                    id:
                        message.id,

                    text:
                        message.text

                };


                updateReplyBar();


                document.getElementById(
                    "messageInput"
                ).focus();


                menu.remove();

            }
        );


    menu.appendChild(
        reply
    );


    const react =
        createMenuButton(
            "❤️ واکنش",
            function() {

                addReaction(
                    message
                );

                menu.remove();

            }
        );


    menu.appendChild(
        react
    );


    if (
        message.sender ===
        currentUser.username
    ) {

        const edit =
            createMenuButton(
                "✏️ ویرایش",
                function() {

                    startEditingMessage(
                        message
                    );

                    menu.remove();

                }
            );


        menu.appendChild(
            edit
        );


        const del =
            createMenuButton(
                "🗑️ حذف",
                function() {

                    deleteMessage(
                        message.id
                    );

                    menu.remove();

                }
            );


        menu.appendChild(
            del
        );

    }


    const copy =
        createMenuButton(
            "📋 کپی",
            function() {

                copyText(
                    message.text || ""
                );

                menu.remove();

            }
        );


    menu.appendChild(
        copy
    );


    event.currentTarget.appendChild(
        menu
    );

}


function createMenuButton(
    text,
    action
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.textContent =
        text;


    button.onclick =
        action;


    return button;

}


/* =========================================================
   EDIT MESSAGE
========================================================= */

function startEditingMessage(
    message
) {

    if (
        !message ||
        message.sender !==
        currentUser.username
    ) {

        return;
    }


    editingMessageId =
        message.id;


    replyingTo =
        null;


    const input =
        document.getElementById(
            "messageInput"
        );


    input.value =
        message.text;


    updateReplyBar();


    document.getElementById(
        "replyBarTitle"
    ).textContent =
        "✏️ ویرایش پیام";


    document.getElementById(
        "replyBarText"
    ).textContent =
        message.text;


    document.getElementById(
        "replyBar"
    ).style.display =
        "flex";


    input.focus();


    showToast(
        "حالت ویرایش فعال شد."
    );

}


/* =========================================================
   DELETE MESSAGE
========================================================= */

function deleteMessage(
    id
) {

    const message =
        messages.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!message) {
        return;
    }


    if (
        message.sender !==
        currentUser.username
    ) {

        return;
    }


    if (
        !confirm(
            "این پیام حذف شود؟"
        )
    ) {

        return;
    }


    messages =
        messages.filter(
            function(item) {

                return item.id !== id;

            }
        );


    if (
        editingMessageId === id
    ) {

        editingMessageId =
            null;

        cancelReply();

    }


    saveMessages();

    renderMessages();

    loadContacts();


    showToast(
        "پیام حذف شد."
    );

}


/* =========================================================
   COPY
========================================================= */

function copyText(
    text
) {

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(text)
            .then(
                function() {

                    showToast(
                        "متن کپی شد."
                    );

                }
            )
            .catch(
                function() {

                    fallbackCopy(
                        text
                    );

                }
            );

    } else {

        fallbackCopy(
            text
        );

    }

}


function fallbackCopy(
    text
) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";

    textarea.style.opacity =
        "0";


    document.body.appendChild(
        textarea
    );


    textarea.select();


    try {

        document.execCommand(
            "copy"
        );

        showToast(
            "متن کپی شد."
        );

    } catch (error) {

        showToast(
            "کپی کردن متن ممکن نبود."
        );

    }


    textarea.remove();

}


/* =========================================================
   REACTION
========================================================= */

function addReaction(
    message
) {

    if (!message.reactions) {

        message.reactions =
            [];

    }


    const selected =
        prompt(
            "واکنش را وارد کن:\n❤️ 👍 😂 😮 😢 👏"
        );


    if (
        !selected
    ) {

        return;
    }


    const reaction =
        selected.trim();


    if (
        !reactions.includes(
            reaction
        )
    ) {

        showToast(
            "واکنش مجاز نیست."
        );

        return;
    }


    message.reactions.push(
        reaction
    );


    saveMessages();

    renderMessages();

}


/* =========================================================
   REPLY / EDIT BAR
========================================================= */

function updateReplyBar() {

    const bar =
        document.getElementById(
            "replyBar"
        );


    if (
        editingMessageId
    ) {

        const target =
            messages.find(
                function(message) {

                    return (
                        message.id ===
                        editingMessageId
                    );

                }
            );


        if (target) {

            document.getElementById(
                "replyBarTitle"
            ).textContent =
                "✏️ ویرایش پیام";


            document.getElementById(
                "replyBarText"
            ).textContent =
                target.text;


            bar.style.display =
                "flex";


            return;

        }

    }


    if (
        !replyingTo
    ) {

        bar.style.display =
            "none";

        return;

    }


    document.getElementById(
        "replyBarTitle"
    ).textContent =
        "↩ پاسخ به پیام";


    document.getElementById(
        "replyBarText"
    ).textContent =
        replyingTo.text;


    bar.style.display =
        "flex";

}


function cancelReply() {

    replyingTo =
        null;


    editingMessageId =
        null;


    const input =
        document.getElementById(
            "messageInput"
        );


    if (input) {

        input.value =
            "";

    }


    updateReplyBar();

}


/* =========================================================
   LAST MESSAGE
========================================================= */

function getLastMessage(
    username
) {

    if (!currentUser) {
        return null;
    }


    const chatId =
        getChatId(
            currentUser.username,
            username
        );


    const list =
        messages.filter(
            function(message) {

                return (
                    message.chatId ===
                    chatId
                );

            }
        );


    if (
        !list.length
    ) {

        return null;

    }


    return list.reduce(
        function(last, item) {

            return (
                Number(
                    item.timestamp || 0
                ) >
                Number(
                    last.timestamp || 0
                )
            )
                ? item
                : last;

        }
    );

}


function getLastMessageText(
    username
) {

    const message =
        getLastMessage(
            username
        );


    if (!message) {

        return "هنوز پیامی نیست";

    }


    const mine =
        normalizeUsername(
            message.sender
        ) ===
        normalizeUsername(
            currentUser.username
        );


    let text =
        String(
            message.text || ""
        );


    if (
        text.startsWith("📎 ")
    ) {

        text =
            "📎 " +
            text.substring(3);

    }


    return (
        mine
            ? "شما: "
            : ""
    ) + text;

}


function getLastMessageTime(
    username
) {

    const message =
        getLastMessage(
            username
        );


    return message
        ? (
            message.time ||
            formatTime(
                message.timestamp
            )
        )
        : "";

}


/* =========================================================
   UNREAD
========================================================= */

function getUnreadCount(
    username
) {

    if (!currentUser) {
        return 0;
    }


    const chatId =
        getChatId(
            currentUser.username,
            username
        );


    return messages.filter(
        function(message) {

            return (
                message.chatId === chatId &&
                normalizeUsername(
                    message.receiver
                ) ===
                normalizeUsername(
                    currentUser.username
                ) &&
                !message.read
            );

        }
    ).length;

}


/* =========================================================
   EMOJI
========================================================= */

function buildEmojiPanel() {

    const grid =
        document.getElementById(
            "emojiGrid"
        );


    if (!grid) {
        return;
    }


    grid.innerHTML =
        "";

                document.createElement(
                    "button"
                );


            button.className =
                "emoji";


            button.type =
                "button";


            button.textContent =
                emoji;


            button.onclick =
                function() {

                    const input =
                        document.getElementById(
                            "messageInput"
                        );


                    input.value +=
                        emoji;


                    input.focus();


                };

            );

        }
    );

}


function toggleEmoji() {

/* =========================================================
   CHAT SETTINGS
========================================================= */

function getChatSettings() {

    if (
        !currentChatUser ||
        !currentUser
    ) {

        return {};

    }


    const key =
        getChatId(
            currentUser.username,
            currentChatUser.username
        );


    if (
        !settings.chats
    ) {

        settings.chats =
            {};

    }


    if (
        !settings.chats[key]
    ) {

        settings.chats[key] = {

            pinned:
                false,

            muted:
                false

        };

    }


    return settings.chats[key];

}


function getChatSettingsForUser(
    username
) {

    if (
        !currentUser
    ) {

        return {};

    }


    if (
        !settings.chats
    ) {

        settings.chats =
            {};

    }


    const key =
        getChatId(
            currentUser.username,
            username
        );


    if (
        !settings.chats[key]
    ) {

        settings.chats[key] = {

            pinned:
                false,

            muted:
                false

        };

    }


    return settings.chats[key];

}


function isPinned(
    username
) {

    const chatSettings =
        getChatSettingsForUser(
            username
        );


    return Boolean(
        chatSettings.pinned
    );

}


function isMuted(
    username
) {

    const chatSettings =
        getChatSettingsForUser(
            username
        );


    return Boolean(
        chatSettings.muted
    );

}

/* =========================================================
   DATE / TIME
========================================================= */

function formatTime(
    timestamp
) {

    if (!timestamp) {
        return "";
    }


    return new Date(
        timestamp
    )
    .toLocaleTimeString(
        "fa-IR",
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}


function formatDate(
    timestamp
) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(
            timestamp
        );


    const today =
        new Date();


    if (
        date.toDateString() ===
        today.toDateString()
    ) {

        return "امروز";

    }


    const yesterday =
        new Date();


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    if (
        date.toDateString() ===
        yesterday.toDateString()
    ) {

        return "دیروز";

    }


    return date.toLocaleDateString(
        "fa-IR",
        {
            year:
                "numeric",

            month:
                "long",

            day:
                "numeric"
        }
    );

}

function escapeHtml(

) {

    return div.innerHTML;

}

            );

                    return (
                        normalizeUsername(

                        normalizeUsername(
                            currentUser.username

            );


        if (freshCurrent) {
